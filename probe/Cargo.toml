[package]
name = "lt_direct_control"
version = "1.5.2-dev3"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-api-stable = { path = "../sdk/mod-api-stable" }
serde_json = "=1.0.151"
# Already built for serde_json; used directly to read one field of a record
# without building a JSON tree (own_selection::contract_team).
serde = "=1.0.229"
png = "=0.17.16"
miniz_oxide = "=0.8.9"

[features]
# Research builds (step 4 of the preview plan, stage C): also the live skill
# reader, the shape table and the research logs. Public builds only draw.
#     cargo build --release --features research
research = []

[workspace]
