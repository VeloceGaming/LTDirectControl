[package]
name = "lt_direct_control"
version = "1.6.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-api-stable = { path = "../sdk/mod-api-stable" }
serde_json = "=1.0.151"
# Already built for serde_json; used directly to read one field of a record
# without building a JSON tree (own_selection::contract_team).
serde = "=1.0.229"
png = "=0.17.16"
miniz_oxide = "=0.8.9"

[features]
# Research builds (step 4 of the preview plan, stage C): also the live skill
# reader, the shape table and the research logs. Public builds only draw.
#     cargo build --release --features research
research = []

# The release DLL (1.6.0): whole-program optimisation, one code unit, so
# the per-frame UI code is inlined across modules.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Stated on purpose: every native hook and the shop window run inside
# `catch_unwind`, which only catches a panic that unwinds. "abort" would
# turn a panic in the mod into a game crash.
panic = "unwind"

[workspace]
